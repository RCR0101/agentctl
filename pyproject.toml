[project]
name = "agentctl"
version = "0.1.0"
description = "Monitor and control Claude Code, Codex and opencode sessions on macOS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RCR0101" }]
keywords = ["claude-code", "codex", "opencode", "ai-agents", "tmux", "tui", "cli", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.12",
    "textual>=0.80",
    "watchdog>=4.0",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/RCR0101/agentctl"
Repository = "https://github.com/RCR0101/agentctl"
Issues = "https://github.com/RCR0101/agentctl/issues"
Documentation = "https://github.com/RCR0101/agentctl#readme"

[project.scripts]
agentctl = "agentctl.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["agentctl"]
